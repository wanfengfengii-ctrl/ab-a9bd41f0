<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沿海档案馆地下库 · 排水泵轮换排程</title>
<style>
  :root {
    --ink: #14213d;
    --muted: #5a6b82;
    --line: #d7dee8;
    --bg: #f3f6fa;
    --card: #ffffff;
    --brand: #0b5fa5;
    --brand-dark: #08457a;
    --ok: #1b7a43;
    --ok-bg: #e7f6ec;
    --warn: #9a6700;
    --warn-bg: #fdf3dc;
    --bad: #b42318;
    --bad-bg: #fdeceb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    background: linear-gradient(120deg, var(--brand-dark), var(--brand));
    color: #fff;
    padding: 22px 28px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
  header p { margin: 6px 0 0; font-size: 13px; opacity: .85; }
  main { max-width: 1080px; margin: 24px auto 60px; padding: 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(20, 33, 61, .05);
  }
  .card h2 {
    margin: 0 0 14px;
    font-size: 15px;
    color: var(--brand-dark);
    border-left: 4px solid var(--brand);
    padding-left: 10px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=number], input[type=text], textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: #fbfcfe;
  }
  input:focus, textarea:focus { outline: 2px solid rgba(11, 95, 165, .25); border-color: var(--brand); }
  textarea { min-height: 74px; resize: vertical; }
  .pump-block { border: 1px dashed var(--line); border-radius: 8px; padding: 14px; }
  .pump-block h3 { margin: 0 0 10px; font-size: 14px; }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
  button {
    background: var(--brand);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 26px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: var(--brand-dark); }
  button:disabled { background: #9bb4cc; cursor: wait; }
  .hint { font-size: 12px; color: var(--muted); }
  .banner { border-radius: 8px; padding: 13px 16px; font-size: 14px; margin-bottom: 18px; white-space: pre-wrap; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid #bfe5cd; }
  .banner.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid #f0dca8; }
  .banner.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid #f3c2bd; }
  .summary { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; }
  .chip {
    background: #eef4fb;
    border: 1px solid #cfe0f1;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
  }
  .chip b { color: var(--brand-dark); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: center; }
  th { background: #eef3f9; color: var(--brand-dark); font-weight: 600; }
  td.num { font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; border-radius: 4px; padding: 2px 8px; font-size: 12px; }
  .tag.idle { background: #eceff3; color: var(--muted); }
  .tag.p1 { background: #e3f0fb; color: var(--brand-dark); }
  .tag.p2 { background: #efe7fb; color: #5b2ea6; }
  .cool-ok { color: var(--ok); }
  .cool-wait { color: var(--warn); }
  .hidden { display: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<header>
  <h1>沿海档案馆地下库 · 排水泵轮换排程</h1>
  <p>暴潮暴雨期间，在完整排程空间内求最优轮换：依次最小化累计耗电、全程最高水量、动作序列（按泵编号字典序）。</p>
</header>

<main>
  <form id="plan-form" class="card" novalidate>
    <h2>水情参数</h2>
    <div class="grid">
      <div style="grid-column: 1 / -1;">
        <label for="inflows">各周期来水量（按发生顺序，6–12 个整数，逗号、空格或换行分隔）</label>
        <textarea id="inflows" required>8, 12, 6, 15, 10, 7</textarea>
      </div>
      <div>
        <label for="initial_water">初始水量</label>
        <input type="number" id="initial_water" value="5" step="1" required>
      </div>
      <div>
        <label for="low_water">安全水位下限</label>
        <input type="number" id="low_water" value="0" step="1" required>
      </div>
      <div>
        <label for="high_water">安全水位上限</label>
        <input type="number" id="high_water" value="20" step="1" required>
      </div>
    </div>

    <h2 style="margin-top:20px;">泵组参数</h2>
    <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));">
      <div class="pump-block">
        <h3>1 号泵</h3>
        <div class="grid" style="grid-template-columns: 1fr 1fr;">
          <div style="grid-column: 1 / -1;">
            <label for="p1-name">名称</label>
            <input type="text" id="p1-name" value="1号泵">
          </div>
          <div><label for="p1-cap">每周期排水量</label><input type="number" id="p1-cap" value="10" min="1" step="1" required></div>
          <div><label for="p1-energy">每周期耗电量</label><input type="number" id="p1-energy" value="4" min="1" step="1" required></div>
          <div style="grid-column: 1 / -1;"><label for="p1-cd">运行后停歇周期数</label><input type="number" id="p1-cd" value="1" min="0" step="1" required></div>
        </div>
      </div>
      <div class="pump-block">
        <h3>2 号泵</h3>
        <div class="grid" style="grid-template-columns: 1fr 1fr;">
          <div style="grid-column: 1 / -1;">
            <label for="p2-name">名称</label>
            <input type="text" id="p2-name" value="2号泵">
          </div>
          <div><label for="p2-cap">每周期排水量</label><input type="number" id="p2-cap" value="14" min="1" step="1" required></div>
          <div><label for="p2-energy">每周期耗电量</label><input type="number" id="p2-energy" value="7" min="1" step="1" required></div>
          <div style="grid-column: 1 / -1;"><label for="p2-cd">运行后停歇周期数</label><input type="number" id="p2-cd" value="2" min="0" step="1" required></div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="submit" id="submit-btn">提交排程</button>
      <span class="hint">同一周期最多运行一台泵；停歇未结束的泵不得再次启动；周期末水量须落在安全闭区间内。</span>
    </div>
  </form>

  <div id="message"></div>
  <section id="result" class="card hidden" aria-live="polite"></section>

  <footer>POST /api/drainage-plans · 穷举全部可行轮换后按字典序目标择优，非单周期贪心</footer>
</main>

<script>
"use strict";

const form = document.getElementById("plan-form");
const btn = document.getElementById("submit-btn");
const msgBox = document.getElementById("message");
const resultBox = document.getElementById("result");

function showBanner(kind, text) {
  msgBox.innerHTML = "";
  const div = document.createElement("div");
  div.className = `banner ${kind}`;
  div.textContent = text;
  msgBox.appendChild(div);
}

function clearOutputs() {
  // 无论报错还是无可行方案，都先撤下旧方案。
  msgBox.innerHTML = "";
  resultBox.classList.add("hidden");
  resultBox.innerHTML = "";
}

function intVal(id, label) {
  const el = document.getElementById(id);
  const raw = el.value.trim();
  if (!/^[+-]?\d+$/.test(raw)) {
    throw new Error(`${label}必须是整数`);
  }
  return Number(raw);
}

function collectPayload() {
  const tokens = document.getElementById("inflows").value.trim().split(/[\s,，;；]+/).filter(Boolean);
  if (tokens.length < 6 || tokens.length > 12) {
    throw new Error(`来水量个数必须在 6 到 12 之间，当前为 ${tokens.length} 个`);
  }
  const inflows = tokens.map((t, i) => {
    if (!/^[+-]?\d+$/.test(t)) throw new Error(`第 ${i + 1} 个来水量“${t}”不是整数`);
    return Number(t);
  });

  const initial = intVal("initial_water", "初始水量");
  const low = intVal("low_water", "安全水位下限");
  const high = intVal("high_water", "安全水位上限");
  if (initial < 0 || low < 0 || high < 0) throw new Error("水量必须为非负整数");
  if (low > high) throw new Error("安全水位下限不能大于上限");

  function pump(prefix, no) {
    const capacity = intVal(`${prefix}-cap`, `${no} 号泵排水量`);
    const energy = intVal(`${prefix}-energy`, `${no} 号泵耗电量`);
    const cooldown = intVal(`${prefix}-cd`, `${no} 号泵停歇周期数`);
    if (capacity < 1) throw new Error(`${no} 号泵排水量必须为正整数`);
    if (energy < 1) throw new Error(`${no} 号泵耗电量必须为正整数`);
    if (cooldown < 0) throw new Error(`${no} 号泵停歇周期数不能为负`);
    return {
      name: document.getElementById(`${prefix}-name`).value.trim() || `${no}号泵`,
      capacity, energy, cooldown
    };
  }

  return {
    inflows,
    initial_water: initial,
    low_water: low,
    high_water: high,
    pumps: [pump("p1", 1), pump("p2", 2)]
  };
}

function el(tag, attrs = {}, text) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  }
  if (text !== undefined) node.textContent = text;
  return node;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function actionTag(row, names) {
  if (row.action === 0) return `<span class="tag idle">待机</span>`;
  const cls = row.action === 1 ? "p1" : "p2";
  const name = escapeHtml(names[row.action - 1]);
  return `<span class="tag ${cls}">${name} 排水 ${row.drain}</span>`;
}

function coolingCell(row, names) {
  return names.map((n) => {
    const left = row.cooling_remaining[n];
    const label = escapeHtml(n);
    if (left > 0) return `<span class="cool-wait">${label}：停歇剩 ${left} 周期</span>`;
    return `<span class="cool-ok">${label}：可启动</span>`;
  }).join("<br>");
}

function renderResult(data) {
  const names = data.spec.pumps.map((p) => p.name);
  const s = data.summary;

  const frag = document.createDocumentFragment();
  frag.appendChild(el("h2", { class: "" }, "最优轮换方案（逐周期）"));

  const banner = el("div", { class: "banner ok" }, data.conclusion);
  frag.appendChild(banner);

  const chips = el("div", { class: "summary" });
  [
    ["累计耗电", s.total_energy],
    ["全程最高水量", s.peak_water],
    ["末期水量", s.final_water],
    ["调度周期数", s.periods],
    [`${names[0]} 运行次数`, s.pump_runs[names[0]]],
    [`${names[1]} 运行次数`, s.pump_runs[names[1]]]
  ].forEach(([k, v]) => {
    const chip = el("span", { class: "chip" }, `${k}：`);
    chip.appendChild(el("b", {}, String(v)));
    chips.appendChild(chip);
  });
  frag.appendChild(chips);

  const table = el("table");
  table.innerHTML = `
    <thead><tr>
      <th>周期</th><th>来水量</th><th>期初水量</th><th>动作</th>
      <th>周期末水量</th><th>各泵冷却状态（周期末）</th>
      <th>本周期耗电</th><th>累计耗电</th>
    </tr></thead>`;
  const tbody = el("tbody");
  for (const row of data.periods) {
    const tr = el("tr");
    tr.innerHTML =
      `<td class="num">${row.period}</td>` +
      `<td class="num">${row.inflow}</td>` +
      `<td class="num">${row.water_start}</td>` +
      `<td>${actionTag(row, names)}</td>` +
      `<td class="num">${row.water_end}</td>` +
      `<td style="text-align:left;font-size:12px;">${coolingCell(row, names)}</td>` +
      `<td class="num">${row.energy_used}</td>` +
      `<td class="num"><b>${row.cumulative_energy}</b></td>`;
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  frag.appendChild(table);

  const range = document.createElement("p");
  range.className = "hint";
  range.textContent = `安全水位闭区间：[${data.spec.low_water}, ${data.spec.high_water}]，上表所有周期末水量均在区间内。`;
  frag.appendChild(range);

  resultBox.appendChild(frag);
  resultBox.classList.remove("hidden");
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  clearOutputs();

  let payload;
  try {
    payload = collectPayload();
  } catch (e) {
    showBanner("bad", `输入非法：${e.message}`);
    return;
  }

  btn.disabled = true;
  btn.textContent = "求解中…";
  try {
    const resp = await fetch("/api/drainage-plans", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    let data = null;
    try { data = await resp.json(); } catch (_) { /* 非 JSON 响应 */ }

    if (!resp.ok) {
      showBanner("bad", `输入非法（${resp.status}）：${data && data.error ? data.error : "服务未能处理该请求"}`);
      return;
    }
    if (!data.feasible) {
      showBanner("warn", `无可行方案：${data.reason}`);
      return;
    }
    renderResult(data);
  } catch (e) {
    showBanner("bad", `请求失败：${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = "提交排程";
  }
});
</script>
</body>
</html>
